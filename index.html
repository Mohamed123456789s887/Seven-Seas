<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Seas Jolie Bay</title>

<link href="https://googleapis.com" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background: linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),
            url("bg-new.png.jpeg");
background-size:cover;
background-position:center;
background-attachment:fixed;
background-repeat: no-repeat;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:470px;
border:2px solid rgba(0,212,212,.5);
border-radius:30px;
background: #0d0d0d; 
padding:30px;
text-align:center;
color:white;
}

.logo{
width:230px;
display:block;
margin:auto;
margin-bottom:25px;
border-radius: 10px;
}
  
.welcome {
    font-family: 'Cinzel', serif;
    font-size: clamp(32px, 10vw, 68px);
    line-height: 1.2;
    text-align: center;
    width: 100%;
    margin-bottom: 20px;
}

.choose{
font-size:18px;
letter-spacing:3px;
}

.ar{
font-size:32px;
color:#00d4d4;
margin-bottom:35px;
font-weight:bold;
}

.lang{
display:flex;
align-items:center;
justify-content:space-between;
background:#161616;
border:2px solid #00d4d4;
border-radius:25px;
padding:18px 20px;
margin:18px 0;
text-decoration:none;
color:white;
transition:.3s;
}

.lang:hover{
transform:scale(1.03);
background:#202020;
}

.flag{
font-size:46px;
}

.name{
flex:1;
font-size:26px;
font-weight:bold;
text-align:left;
margin-left:20px;
}

.arrow{
font-size:42px;
color:#00d4d4;
}

.footer{
margin-top:35px;
font-size:28px;
color:#00d4d4;
}

.footer2{
font-size:24px;
margin-top:10px;
}

.footer3{
font-size:18px;
color:#00d4d4;
}

</style>

</head>

<body>

<div class="card">

<img class="logo" src="logo-new.png.jpeg">

<div class="welcome">WELCOME</div>

<div class="choose">CHOOSE YOUR LANGUAGE</div>

<div class="ar">اختر لغتك</div>

<!-- تم تعديل مسارات الأزرار لتقرأ الملفات مباشرة من جيت هب -->
<a class="lang" href="menu-ar.pdf" target="_blank">
<div class="flag">🇸🇦</div>
<div class="name">العربية</div>
<div class="arrow">❯</div>
</a>

<a class="lang" href="menu-en.pdf" target="_blank">
<div class="flag">🇬🇧</div>
<div class="name">English</div>
<div class="arrow">❯</div>
</a>

<a class="lang" href="menu-de.pdf" target="_blank">
<div class="flag">🇩🇪</div>
<div class="name">Deutsch</div>
<div class="arrow">❯</div>
</a>

<a class="lang" href="menu-ru.pdf" target="_blank">
<div class="flag">🇷🇺</div>
<div class="name">Русский</div>
<div class="arrow">❯</div>
</a>

<div class="footer">🐚</div>

<div class="footer2">
ENJOY YOUR STAY
</div>

<div class="footer3">
نتمنى لك إقامة سعيدة
</div>

</div>

</body>
</html>
