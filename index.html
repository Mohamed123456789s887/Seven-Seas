<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Seas Jolie Bay</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Poppins', Arial, sans-serif;
}

body{
  /* استخدم الصورة المحلية project.jpeg كخلفية مع طبقة تظلّلية */
  background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url("project.jpeg");
  background-size:cover;
  background-position:center;
  background-attachment: fixed;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
}

.card{
  width:100%;
  max-width:460px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(8px) saturate(120%);
  -webkit-backdrop-filter: blur(8px) saturate(120%);
  border-radius:24px;
  padding:36px 30px;
  text-align:center;
  color:#ffffff;
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.08);
}

.logo{
  margin-bottom:12px;
}

.logo img{
  max-width:92px;
  height:auto;
  display:inline-block;
  filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
}

.hotel{
  font-size:28px;
  font-weight:700;
  color:#00e1d1;
  margin-bottom:8px;
  line-height:1.05;
}

.sub{
  font-size:16px;
  margin-bottom:20px;
  color: #e6f9f6;
}

.button{
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  background: linear-gradient(90deg,#00b8c8,#00e1d1);
  color: #002b2a;
  padding:14px 16px;
  margin:10px 0;
  border-radius:14px;
  font-size:18px;
  font-weight:600;
  transition: transform .18s ease, box-shadow .18s ease;
  box-shadow: 0 6px 20px rgba(0,0,0,0.28);
}

.button:hover{
  transform: translateY(-4px);
  box-shadow: 0 14px 30px rgba(0,0,0,0.36);
}

.footer{
  margin-top:18px;
  font-size:13px;
  color:#dfeff0;
}

@media (max-width:420px){
  .card{ padding:26px 18px; }
  .hotel{ font-size:24px }
  .button{ font-size:16px; padding:12px 10px }
}

</style>

</head>

<body>

<div class="card">

  <div class="logo"><img src="logo.png" alt="Seven Seas Jolie Bay Logo"></div>

  <div class="hotel">
    SEVEN SEAS<br>
    JOLIE BAY
  </div>

  <div class="sub">
    Choose Your Language
  </div>

  <a class="button" href="https://drive.google.com/file/d/1grBeP_nVQmDe-2Yg1lHycqgPlBuQ9maR/view?usp=drivesdk" target="_blank">
    🇸🇦 AR | العربية
  </a>

  <a class="button" href="https://drive.google.com/file/d/1V1LCGLpbrWQoFWFk3sooRvrm0NJH_91C/view?usp=drivesdk" target="_blank">
    🇬🇧 EN | English
  </a>

  <a class="button" href="https://drive.google.com/file/d/1ricTxqwGUGE4hC3bKzJndOmNAdPR6ply/view?usp=drivesdk" target="_blank">
    🇩🇪 DE | Deutsch
  </a>

  <a class="button" href="https://drive.google.com/file/d/1ZlRGgXnhWlFnFhw4LAHLXtwY0PQfrGG8/view?usp=drivesdk" target="_blank">
    🇷🇺 RU | Русский
  </a>

  <div class="footer">
    Welcome to Seven Seas Jolie Bay ❤️
  </div>

</div>

</body>

</html>
