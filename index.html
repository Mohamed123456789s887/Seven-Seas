<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Seven Seas Jolie Bay</title> 
    <style> 
        body { 
            margin: 0; 
            font-family: Arial, Helvetica, sans-serif; 
            /* تغيير الخلفية إلى الصورة الحقيقية للمنتجع */
            background: url('https://unsplash.com') center/cover no-repeat fixed; 
            /* إذا كنت تملك رابط مباشر لصورة الفندق الخاصة بك، استبدل الرابط بالأعلى برابط صورتك */
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            box-sizing: border-box;
        } 
        .overlay { 
            background: rgba(0, 0, 0, 0.75); /* زيادة التعتيم قليلاً لتوضيح اللوجو الأبيض */
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            width: 90%; 
            max-width: 450px; 
            color: #fff; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        } 
        /* تنسيق اللوجو الجديد */
        .logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 15px;
            background: white; /* إضافة خلفية بيضاء خفيفة دائرية لبروز اللوجو بدقة */
            padding: 10px;
            border-radius: 12px;
        }
        h1 { 
            margin: 5px 0; 
            font-size: 28px; 
        } 
        h3 { 
            margin-top: 5px;
            margin-bottom: 25px; 
            font-weight: normal; 
            font-size: 16px;
            opacity: 0.9;
        } 
        a { 
            display: block; 
            text-decoration: none; 
            background: #00b8c8; 
            color: white; 
            padding: 14px; 
            margin: 12px 0; 
            border-radius: 12px; 
            font-size: 20px; 
            font-weight: bold; 
            transition: .3s; 
        } 
        a:hover { 
            background: #008ea0; 
            transform: scale(1.03); 
        } 
    </style> 
</head> 
<body> 

    <div class="overlay"> 
        <!-- إضافة شعار الفندق (اللوجو) -->
        <img src="https://bstatic.com" alt="Seven Seas Jolie Bay Logo" class="logo">
        
        <h1>Seven Seas Jolie Bay</h1> 
        <h3>Choose Your Language</h3> 
        
        <a href="https://google.com" target="_blank">🇸🇦 العربية</a> 
        <a href="https://google.com" target="_blank">🇬🇧 English</a> 
        <a href="https://google.com" target="_blank">🇩🇪 Deutsch</a> 
        <a href="https://google.com" target="_blank">🇷🇺 Русский</a> 
    </div> 

</body> 
</html>
