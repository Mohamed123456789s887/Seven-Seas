<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Seas Jolie Bay</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
/* استخدم الصورة المحلية bg-new.png.jpeg كخلفية مع تراكب داكن */
background-image:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
url("bg-new.png.jpeg");

/* ضبط التكرار، الحجم، والمحاذاة */
background-repeat:no-repeat;
background-size:cover;
background-position:center;

/* خيار: اجعل الخلفية ثابتة أثناء التمرير (اختياري) */
/* background-attachment: fixed; */

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{

width:90%;
max-width:450px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(10px);

border-radius:25px;

padding:35px;

text-align:center;

color:white;

box-shadow:0 0 25px rgba(0,0,0,.4);

}

.logo{

margin-bottom:10px;

}

.logo img{

max-width:100px;
height:auto;

}

.hotel{

font-size:28px;

font-weight:bold;

color:#00d4c8;

margin-bottom:8px;

}

.sub{

font-size:18px;

margin-bottom:30px;

}

.button{

display:flex;

align-items:center;

justify-content:center;

text-decoration:none;

background:#00b8c8;

color:white;

padding:18px;

margin:14px 0;

border-radius:15px;

font-size:22px;

font-weight:bold;

transition:.3s;

}

.button:hover{

background:#0098aa;

transform:scale(1.04);

}

.footer{

margin-top:25px;

font-size:14px;

color:#ddd;

}

</style>

</head>

<body>

<div class="card">

<div class="logo"><img src="logo.png" alt="Seven Seas Jolie Bay Logo"></div>

<div class="hotel">

SEVEN SEAS<br>

JOLIE BAY

</div>
